<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>a11y-now playground</title>
    <style>
      html.dark body {
        background: #14181d;
        color: #e6e8eb;
      }
      html.dark a {
        color: #8ec3f2;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>a11y-now Playground</h1>
      <button id="mode-toggle" type="button">🌓 切换站点明暗</button>
    </header>
    <nav><a href="#features">功能</a> <a href="#docs">文档</a></nav>
    <main>
      <article id="features">
        <h2>试试工具栏</h2>
        <p>
          顶部是 a11y-now 全量预设：区域导航、语音、配色、缩放、十字线、大字幕……
        </p>
        <p>按 <kbd>Ctrl+Alt+?</kbd> 查看全部快捷键。</p>
      </article>
      <form>
        <label>搜索 <input type="search" /></label>
      </form>
      <ul>
        <li>列表项一</li>
        <li>列表项二</li>
        <li>列表项三</li>
      </ul>
    </main>
    <aside data-a11y-skip>此区域带 data-a11y-skip，换肤时保持原样。</aside>
    <footer>Playground Footer</footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
