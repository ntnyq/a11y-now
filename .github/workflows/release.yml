name: Release

permissions:
  id-token: write
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm dlx changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm install -g npm@latest
      # -r: publish every public workspace package (the root is private).
      # Auth is Trusted Publishing (OIDC): every package trusts this workflow,
      # so no npm token is involved (id-token: write above).
      - run: pnpm -r publish --no-git-checks
